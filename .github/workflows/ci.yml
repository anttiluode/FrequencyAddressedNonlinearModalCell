name: test-and-receipt

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m frequency_modal_cell.experiment --output results/ci-v0.json
      - run: python -m frequency_modal_cell.axon_experiment --output results/ci-v1.json
      - run: diff -u results/v1_axonal_matter.json results/ci-v1.json
      - run: python -m frequency_modal_cell.axon_attacker_experiment --output results/ci-v2.json
      - run: diff -u results/v2_fixed_delay_attacker.json results/ci-v2.json
      - run: python -m frequency_modal_cell.virtual_organoid_experiment --output results/ci-v3.json
      - run: python -c "import json; a=json.load(open('results/v3_virtual_organoid.json')); b=json.load(open('results/ci-v3.json')); assert a == b"
      - run: python -m frequency_modal_cell.active_language_experiment --output results/ci-v4.json
      - run: python -c "import json; a=json.load(open('results/v4_budgeted_language.json')); b=json.load(open('results/ci-v4.json')); assert a == b"
      - run: python -m frequency_modal_cell.drift_experiment --output results/ci-v5.json
      - run: cat results/ci-v5.json
